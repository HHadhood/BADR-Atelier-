<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">BADR Atelier global project reach</title>
<desc id="desc">Stylized world map showing project locations across Egypt, Saudi Arabia, UAE, Qatar, Kuwait, Oman, Canada and the United States.</desc>
<style>
  .bg{fill:#10100e}.land{fill:#1b1a16;stroke:#4b422f;stroke-width:1.1}.grid{stroke:#2f2b22;stroke-width:.7;opacity:.45}.arc{fill:none;stroke:#8b6728;stroke-width:1.2;opacity:.35}.pin{fill:#d7ad54}.ring{fill:none;stroke:#e5c77c;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}.label{font:600 15px Arial,sans-serif;fill:#f3ead3;letter-spacing:.05em}.sub{font:500 11px Arial,sans-serif;fill:#9f9788;letter-spacing:.08em}.hq{fill:#f6d782}.hqring{stroke:#f6d782}.small{font:600 10px Arial,sans-serif;fill:#cbbd9a;letter-spacing:.08em}.route{fill:none;stroke:#cba24d;stroke-width:1;stroke-dasharray:4 7;opacity:.42}
  @keyframes pulse{0%{transform:scale(.7);opacity:.95}75%,100%{transform:scale(2.4);opacity:0}}
</style>
<rect class="bg" width="1200" height="620" rx="28"/>
<g opacity=".55">
  <path class="grid" d="M0 124H1200M0 248H1200M0 372H1200M0 496H1200"/>
  <path class="grid" d="M200 0V620M400 0V620M600 0V620M800 0V620M1000 0V620"/>
</g>
