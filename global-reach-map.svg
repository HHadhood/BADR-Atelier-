<path class="land" d="M563 143l40-26 52 4 37-21 68 13 27-18 52 16 44-4 47 28 46 1 40 20 18 33-28 22-33 6-15 22-46 4-31 33-33 7-21-17-57 2-39-17-42 4-31-27-42-5-27-35 4-44z"/>
<path class="land" d="M660 265l43 6 42 30 26 53-8 48-36 65-40 39-46-5-27-42-22-51 7-65 24-57 37-21z"/>
<path class="land" d="M979 387l56-13 44 22 25 35-20 32-51 10-52-20-17-36 15-30z"/>
<path class="land" d="M518 88l21-24 33-8 24 16-3 31-38 16-34-9-3-22z"/>
